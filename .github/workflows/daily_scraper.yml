name: Daily Car Scraper

on:
  schedule:
    # שעון השרת הוא UTC. שעה 07:00 ב-UTC שווה ל-09:00 בבוקר שעון ישראל (בחורף) או 10:00 (בקיץ)
    - cron: '0 7 * * *'
  workflow_dispatch: # מאפשר לך להריץ את הסקריפט ידנית מתי שתרצה בלחיצת כפתור

permissions:
  contents: write # נותן לשרת הרשאה לדחוף את קבצי ה-JSON המעודכנים חזרה למאגר

jobs:
  scrape_and_update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scraper
        env:
          # כאן אנחנו מושכים את הסודות שהגדרת בשלב 3
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
        run: python -u main.py

      - name: Commit and push changes
        run: |
          # הגדרת בוט שישמור את התוצאות החדשות שנוצרו
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add processed_tokens.json gemini_results_history.json
          # התנאי מוודא שנבצע שמירה רק אם באמת נוספו רכבים חדשים
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update cars data [skip ci]" && git push)
