name: Price Monitor

on:
  schedule:
    # שעון השרת הוא UTC. שעה 12:00 ב-UTC שווה ל-14:00 שעון ישראל (חורף)
    - cron: '23 11 * * *' # ירוץ ב-14:23 בצהריים (שעון קיץ)
  workflow_dispatch: # מאפשר הרצה ידנית מהממשק

permissions:
  contents: write # נדרש כדי שהבוט יוכל לשמור את עדכוני המחירים חזרה למאגר

jobs:
  monitor_prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Price Monitor
        env:
          # הסקריפט הזה משתמש באותם מפתחות API ואימייל בדיוק
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
        run: python -u price_monitor.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # הסקריפט מעדכן את קובץ התוצאות (מחירים שירדו) ומנקה מודעות שהוסרו מהזיכרון
          git add gemini_results_history.json processed_tokens.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update prices and clean removed ads" && git push)
